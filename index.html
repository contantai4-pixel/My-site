           যাতে একটি আরেকটির atOptions ওভাররাইট না করে।
    ====================================================================== -->
    <section id="belowAdsSection" class="w-full max-w-4xl mx-auto px-4 pb-14 pt-2 flex flex-col items-center gap-6">

        <!-- Desktop Banner Container (728x90 Isolated Iframe) -->

        <div id="mobileBannerSlot" class="flex md:hidden items-center justify-center min-h-[50px] w-full overflow-hidden rounded-xl bg-white/[0.02] border border-white/[0.06]"></div>

        <!-- Native Banner Container -->
        <div class="w-full rounded-2xl bg-white/[0.02] border border-white/[0.06] p-3 flex items-center justify-center overflow-hidden">
            <script async fetchpriority="high" data-cfasync="false" src="https://bicea.org/21/5814526dda29e93b5ab26f713c57effe"></script>

    <!-- Social Bar Script (ভিডিও প্লেয়ার লোড হওয়ার পর যুক্ত করা হয়েছে) -->
    <script data-cfasync="false" src="https://bicea.org/14/6d8f7ab2ff830ea1079469f86550ea68"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playerCard = document.getElementById('videoPlayerCard');
            const playerThumbnail = document.getElementById('playerThumbnail');
            const defaultDarkCanvas = document.getElementById('defaultDarkCanvas');
            const interactiveOverlay = document.getElementById('interactiveOverlay');
            const btnDesktopView = document.getElementById('btnDesktopView');
            const btnMobileView = document.getElementById('btnMobileView');
            const desktopBannerSlot = document.getElementById('desktopBannerSlot');
            const mobileBannerSlot = document.getElementById('mobileBannerSlot');

            // Helper to render each atOptions banner inside its own isolated iframe
            function mountIsolatedBanner(targetContainer, options, scriptSrc) {
                if (!targetContainer) return;
                targetContainer.innerHTML = '';

                const iframe = document.createElement('iframe');
                iframe.width = String(options.width);
                iframe.height = String(options.height);
                iframe.style.width = `${options.width}px`;
                iframe.style.height = `${options.height}px`;
                iframe.style.maxWidth = '100%';
                iframe.style.border = '0';
                iframe.style.overflow = 'hidden';
                iframe.setAttribute('scrolling', 'no');
                iframe.setAttribute('frameborder', '0');
                iframe.setAttribute('allowtransparency', 'true');

                targetContainer.appendChild(iframe);

                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    const safeOptions = JSON.stringify(options);
                    doc.open();
                    doc.write(`<!DOCTYPE html><html><head><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;}</style></head><body><script type="text/javascript">window.atOptions = ${safeOptions};<\/script><script type="text/javascript" data-cfasync="false" src="${scriptSrc}"><\/script></body></html>`);
                    doc.close();
                } catch (err) {
                    // Fallback if iframe document access is restricted
                    const fallbackScript = document.createElement('script');
                    fallbackScript.async = true;
                    fallbackScript.setAttribute('data-cfasync', 'false');
                    fallbackScript.src = scriptSrc;
                    targetContainer.appendChild(fallbackScript);
                }
            }

            // Mount Desktop Banner (728x90) and Mobile Banner (320x50) independently
            mountIsolatedBanner(
                desktopBannerSlot,
                {
                    key: 'c278e81b056b0c587ecad6e1be41755b',
                    format: 'iframe',
                    height: 90,
                    width: 728,
                    params: {}
                },
                'https://bicea.org/22/c278e81b056b0c587ecad6e1be41755b'
            );

            mountIsolatedBanner(
                mobileBannerSlot,
                {
                    key: '35b219c913b72b9aea070b9d8f0cf70e',
                    format: 'iframe',
                    height: 50,
                    width: 320,
                    params: {}
                },
                'https://bicea.org/22/35b219c913b72b9aea070b9d8f0cf70e'
            );

            // Smart PostImg URL Resolver (যাতে পেজ লিংক দিলেও সরাসরি হাই-রেজোলিউশন ছবি লোড হয়)
            function resolveDirectImageCandidates(url) {
                const cleanUrl = (url || "").trim();
                const postimgMatch = cleanUrl.match(/^https?:\/\/(?:www\.)?postimg\.cc\/([a-zA-Z0-9]+)/i);
                if (postimgMatch && postimgMatch[1]) {
                    const id = postimgMatch[1];
                    return [
                        `https://i.postimg.cc/${id}/image.jpg`,
                        `https://i.postimg.cc/${id}/image.png`,
                        `https://i.postimg.cc/${id}/image.webp`,
                        `https://i.postimg.cc/${id}/photo.jpg`
                    ];
                }
                return cleanUrl ? [cleanUrl] : [];
            }

            const candidates = resolveDirectImageCandidates(IMAGE_URL);
            let candidateIndex = 0;

            function loadNextCandidate() {
                if (candidateIndex < candidates.length) {
                    playerThumbnail.src = candidates[candidateIndex];
                    playerThumbnail.classList.remove('hidden');
                    defaultDarkCanvas.classList.add('hidden');
                    candidateIndex++;
                } else {
                    playerThumbnail.classList.add('hidden');
                    defaultDarkCanvas.classList.remove('hidden');
                }
            }

            playerThumbnail.addEventListener('error', loadNextCandidate);
            if (candidates.length > 0) {
                loadNextCandidate();
            }

            // Desktop / Mobile Preview Switcher
            btnDesktopView.addEventListener('click', (e) => {
                e.stopPropagation();
                playerCard.classList.remove('mobile-sim');
                btnDesktopView.className = 'px-3 py-1 rounded-full text-xs font-medium bg-white/15 text-white transition-all cursor-pointer';
                btnMobileView.className = 'px-3 py-1 rounded-full text-xs font-medium text-white/60 hover:text-white transition-all cursor-pointer';
            });

            btnMobileView.addEventListener('click', (e) => {
                e.stopPropagation();
                playerCard.classList.add('mobile-sim');
                btnMobileView.className = 'px-3 py-1 rounded-full text-xs font-medium bg-white/15 text-white transition-all cursor-pointer';
                btnDesktopView.className = 'px-3 py-1 rounded-full text-xs font-medium text-white/60 hover:text-white transition-all cursor-pointer';
            });

            // Handle Click / Tap on Play Button & Player Card -> Open Direct Link
            let resetTimeout;
            function triggerPlayInteraction() {
                interactiveOverlay.classList.remove('hidden');
                clearTimeout(resetTimeout);

                if (TARGET_LINK && TARGET_LINK.trim() !== "") {
                    let destination = TARGET_LINK.trim();
                    if (!/^https?:\/\//i.test(destination)) {
                        destination = 'https://' + destination;
                    }
                    resetTimeout = setTimeout(() => {
                        window.open(destination, '_blank', 'noopener,noreferrer');
                        interactiveOverlay.classList.add('hidden');
                    }, 180);
                    return;
                }

                resetTimeout = setTimeout(() => {
                    interactiveOverlay.classList.add('hidden');
                }, 1500);
            }

            playerCard.addEventListener('click', triggerPlayInteraction);
            playerCard.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    triggerPlayInteraction();
                }
            });
        });
    </script>
